<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-labelledby="diagramTitle diagramDesc" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="diagramTitle">Cascade Cycleworks real-time pipeline: CDC and streaming telemetry into Apache Iceberg, refined by Dynamic Tables, served to an agent and read from outside Snowflake</title>
  <desc id="diagramDesc">Two source feeds flow left to right through four stages, and both arrive over Snowpipe Streaming. Stage one, sources: station sensors emitting telemetry, and a Postgres MES database of frame scans. Stage two, landing in Snowflake-managed Apache Iceberg v3: station telemetry streams straight into the STATION_TELEMETRY Iceberg table; in parallel, the simulated Openflow Postgres CDC connector appends change events to the QUALITY_INSPECTIONS_JOURNAL Iceberg table, an APPEND_ONLY stream on that journal feeds a MERGE the connector issues itself on a thirty-second gate, and that MERGE maintains the QUALITY_INSPECTIONS destination table using soft deletes. The destination is a standard table, not Iceberg, because it takes continuous updates and deletes. Stage three, refinement by four Dynamic Iceberg Tables, all INCREMENTAL with a one-minute target lag: STATION_HEALTH rolls telemetry up per station and five-minute bucket, INSPECTIONS_ACTIVE filters soft-deleted rows out of QUALITY_INSPECTIONS, then YIELD_BY_LINE_5MIN joins those two on line and five-minute bucket while DEFECT_COUNTS_5MIN counts defects at their natural grain. Stage four, serving: the semantic view PLANT_FLOOR_SV sits over three tables, YIELD_BY_LINE_5MIN, DEFECT_COUNTS_5MIN and STATION_HEALTH, so STATION_HEALTH reaches the view directly as well as through the join; the Cascade Plant Analyst Cortex Agent answers plain-language questions through that semantic view. Outside Snowflake entirely, PyIceberg on a laptop reads the same gold Iceberg tables through the Horizon Catalog with vended credentials, using no warehouse.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <style>
    .band      { fill: #f6f8fa; stroke: #e2e6ea; stroke-width: 1; rx: 10; }
    .bandLabel { font-size: 12px; font-weight: 700; fill: #6a7480; letter-spacing: .09em; }
    .bandSub   { font-size: 10px; fill: #8b949e; }
    .src       { fill: #eef1f4; stroke: #b9c1cb; stroke-width: 1.5; rx: 8; }
    .ice       { fill: #e6f3fb; stroke: #29b5e8; stroke-width: 1.5; rx: 8; }
    .std       { fill: #f1f0f6; stroke: #9b93b8; stroke-width: 1.5; rx: 8; }
    .dt        { fill: #e6f6ef; stroke: #2eab6f; stroke-width: 1.5; rx: 8; }
    .serve     { fill: #fdf0e6; stroke: #e8883a; stroke-width: 1.5; rx: 8; }
    .name      { font-size: 11.5px; font-weight: 600; fill: #16202b; }
    .sub       { font-size: 10.5px; fill: #5b6472; }
    .edge      { stroke: #5b6472; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .edgeSoft  { stroke: #9aa4b2; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrowLight); }
    .edgeLabel { font-size: 10px; fill: #6a7480; font-style: italic; }
    .legend    { font-size: 10.5px; fill: #5b6472; }
  </style>

  <!-- ── stage bands ───────────────────────────────────────────── -->
  <rect class="band" x="16"  y="58" width="156" height="332"/>
  <rect class="band" x="184" y="58" width="308" height="332"/>
  <rect class="band" x="504" y="58" width="392" height="332"/>
  <rect class="band" x="908" y="58" width="276" height="332"/>

  <text class="bandLabel" x="94"   y="44" text-anchor="middle">SOURCES</text>
  <text class="bandLabel" x="338"  y="44" text-anchor="middle">LAND IN ICEBERG v3</text>
  <text class="bandLabel" x="700"  y="44" text-anchor="middle">REFINE INCREMENTALLY</text>
  <text class="bandLabel" x="1046" y="44" text-anchor="middle">SERVE</text>

  <text class="bandSub" x="338" y="80" text-anchor="middle">both feeds arrive over Snowpipe Streaming</text>
  <text class="bandSub" x="700" y="80" text-anchor="middle">all four Dynamic Tables: INCREMENTAL · TARGET_LAG 1 minute</text>

  <!-- ── sources ───────────────────────────────────────────────── -->
  <rect class="src" x="26" y="104" width="136" height="54"/>
  <text class="name" x="94" y="126" text-anchor="middle">Station sensors</text>
  <text class="sub"  x="94" y="143" text-anchor="middle">~60 rows/sec</text>

  <rect class="src" x="26" y="208" width="136" height="54"/>
  <text class="name" x="94" y="230" text-anchor="middle">Postgres MES</text>
  <text class="sub"  x="94" y="247" text-anchor="middle">frame scans: PASS / FAIL</text>

  <!-- ── landing ───────────────────────────────────────────────── -->
  <rect class="ice" x="248" y="104" width="180" height="54"/>
  <text class="name" x="338" y="126" text-anchor="middle">STATION_TELEMETRY</text>
  <text class="sub"  x="338" y="143" text-anchor="middle">Iceberg v3</text>

  <rect class="ice" x="248" y="208" width="180" height="62"/>
  <text class="name" x="338" y="228" text-anchor="middle">QUALITY_INSPECTIONS</text>
  <text class="name" x="338" y="243" text-anchor="middle">_JOURNAL</text>
  <text class="sub"  x="338" y="259" text-anchor="middle">Iceberg v3 · APPEND_ONLY stream</text>

  <rect class="std" x="248" y="314" width="180" height="56"/>
  <text class="name" x="338" y="337" text-anchor="middle">QUALITY_INSPECTIONS</text>
  <text class="sub"  x="338" y="354" text-anchor="middle">standard table · soft deletes</text>

  <!-- MERGE, journal -> destination -->
  <path class="edge" d="M 338 270 L 338 312"/>
  <text class="edgeLabel" x="348" y="287">MERGE, issued by</text>
  <text class="edgeLabel" x="348" y="299">the connector · 30 s gate</text>

  <!-- sources -> landing -->
  <path class="edge" d="M 162 131 L 246 131"/>

  <path class="edge" d="M 162 235 L 246 235"/>
  <text class="edgeLabel" x="192" y="182">simulated Openflow</text>
  <text class="edgeLabel" x="192" y="194">CDC connector</text>

  <!-- ── refine: silver ────────────────────────────────────────── -->
  <rect class="dt" x="520" y="104" width="144" height="54"/>
  <text class="name" x="592" y="126" text-anchor="middle">STATION_HEALTH</text>
  <text class="sub"  x="592" y="143" text-anchor="middle">5-min rollup</text>

  <rect class="dt" x="520" y="314" width="144" height="56"/>
  <text class="name" x="592" y="337" text-anchor="middle">INSPECTIONS_ACTIVE</text>
  <text class="sub"  x="592" y="354" text-anchor="middle">drops soft-deleted</text>

  <!-- ── refine: gold ──────────────────────────────────────────── -->
  <rect class="dt" x="726" y="186" width="144" height="64"/>
  <text class="name" x="798" y="211" text-anchor="middle">YIELD_BY_LINE_5MIN</text>
  <text class="sub"  x="798" y="228" text-anchor="middle">joins on line + bucket</text>

  <rect class="dt" x="726" y="300" width="144" height="64"/>
  <text class="name" x="798" y="325" text-anchor="middle">DEFECT_COUNTS_5MIN</text>
  <text class="sub"  x="798" y="342" text-anchor="middle">defect grain</text>

  <!-- landing -> refine -->
  <path class="edge" d="M 428 131 L 518 131"/>
  <path class="edge" d="M 428 342 L 518 342"/>

  <!-- silver -> gold -->
  <path class="edge" d="M 664 145 C 690 145 698 190 724 201"/>
  <path class="edge" d="M 664 328 C 690 328 700 250 724 238"/>
  <path class="edge" d="M 664 352 C 688 352 702 342 724 339"/>

  <!-- ── serve ─────────────────────────────────────────────────── -->
  <rect class="serve" x="952" y="190" width="176" height="56"/>
  <text class="name" x="1040" y="213" text-anchor="middle">PLANT_FLOOR_SV</text>
  <text class="sub"  x="1040" y="230" text-anchor="middle">semantic view over all three</text>

  <rect class="serve" x="952" y="290" width="176" height="56"/>
  <text class="name" x="1040" y="313" text-anchor="middle">Cascade Plant Analyst</text>
  <text class="sub"  x="1040" y="330" text-anchor="middle">Cortex Agent</text>

  <!-- gold -> semantic view -->
  <path class="edge" d="M 870 226 C 900 226 920 218 950 212"/>
  <path class="edge" d="M 870 318 C 902 318 918 258 950 236"/>

  <!-- STATION_HEALTH feeds the view directly as well as the join -->
  <path class="edge" d="M 664 122 C 780 116 940 130 988 186"/>
  <text class="edgeLabel" x="796" y="112" text-anchor="middle">stations, straight to the view</text>

  <!-- semantic view -> agent -->
  <path class="edge" d="M 1040 246 L 1040 288"/>

  <!-- ── outside Snowflake ─────────────────────────────────────── -->
  <rect class="src" x="1000" y="436" width="176" height="54"/>
  <text class="name" x="1088" y="458" text-anchor="middle">PyIceberg</text>
  <text class="sub"  x="1088" y="475" text-anchor="middle">on your laptop · no warehouse</text>

  <path class="edgeSoft" d="M 820 364 C 820 440 900 470 996 463"/>
  <text class="edgeLabel" x="524" y="418">Horizon Catalog · vended credentials</text>
  <text class="edgeLabel" x="524" y="430">the same Parquet files, no Snowflake compute</text>

  <!-- ── legend ────────────────────────────────────────────────── -->
  <text class="legend" x="20" y="508">Only the connector is simulated. Everything downstream is what you would build for real.</text>

  <rect class="ice"   x="20"  y="525" width="14" height="14"/>
  <text class="legend" x="42"  y="536">Iceberg v3, Snowflake-managed</text>

  <rect class="std"   x="216" y="525" width="14" height="14"/>
  <text class="legend" x="238" y="536">standard table</text>

  <rect class="dt"    x="332" y="525" width="14" height="14"/>
  <text class="legend" x="354" y="536">Dynamic Iceberg Table</text>

  <rect class="serve" x="485" y="525" width="14" height="14"/>
  <text class="legend" x="507" y="536">serving layer</text>

  <rect class="src"   x="596" y="525" width="14" height="14"/>
  <text class="legend" x="618" y="536">outside Snowflake</text>
</svg>
