definition_version: 2
entities:
  plant_floor_live:
    type: streamlit
    identifier:
      name: PLANT_FLOOR_LIVE
      database: MFG
      schema: ANALYTICS
    query_warehouse: HOL_WH
    main_file: streamlit_app.py
    artifacts:
      - streamlit_app.py
      - environment.yml
    # Warehouse runtime: no compute_pool and no runtime_name. A container
    # runtime needs a compute pool node to start before the app serves, and
    # the app only reads three Dynamic Tables, so the pool buys nothing here.
    # environment.yml pins Streamlit: an unpinned warehouse-runtime app came up
    # on a build with no st.fragment, which the auto-refresh needs.
